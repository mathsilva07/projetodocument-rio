<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <section id="contato" class="conta-secao">
    <h2>Entre em contato</h2>
    <p>Quer saber mais sobre o cinema BrasileirO? Mande uma mensagem para nós! </p>

    <form class="contato-form">
      <label for="nome">Seu nome</label>
      <input type="nome" id="nome" name="nome" placeholder="dIGIte seu nome" required>

      <label for="email">Difite seu e-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu email" required>

      <label for="mensagem">Digite sua mensagem</label>
      <textarea name="mensagem" id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui" required></textarea>

      <button type="submit">Enviar Mensagem</button>
    </form>
  </section>
</body>
</html>
